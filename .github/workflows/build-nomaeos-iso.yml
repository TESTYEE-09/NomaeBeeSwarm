name: Build and publish NomaeOS ISO

on:
  push:
    branches: [main]
    paths:
      - "Containerfile"
      - "build_files/**"
      - "system_files/**"
      - "disk_config/**"
      - "scripts/**"
      - ".github/workflows/build-nomaeos-iso.yml"
  workflow_dispatch:

concurrency:
  group: nomaeos-public-iso
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      VERSION: 0.1.0
      IMAGE: localhost/nomaeos:0.1.0
      ISO_NAME: NomaeOS-Nomae-Box-amd64.iso
      RELEASE_TAG: nomaeos-v0.1.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e
        with:
          remove-codeql: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman jq
          podman --version
          gh --version
          df -h

      - name: Validate source
        run: bash scripts/check.sh

      - name: Build NomaeOS bootc image locally
        run: |
          set -euxo pipefail
          sudo podman build \
            --pull=newer \
            --format oci \
            --build-arg VERSION="$VERSION" \
            --build-arg REVISION="$GITHUB_SHA" \
            --tag "$IMAGE" \
            .
          sudo podman image inspect "$IMAGE"
          df -h

      - name: Build installer ISO from local image
        run: |
          set -euxo pipefail
          mkdir -p output release-assets
          sudo podman pull quay.io/centos-bootc/bootc-image-builder:latest
          sudo podman run --rm --privileged \
            --security-opt label=disable \
            -v "$PWD/disk_config/iso.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --use-librepo=True \
            --chown "$(id -u):$(id -g)" \
            "$IMAGE"

          source_iso=$(find output -type f -name '*.iso' -print -quit)
          test -n "$source_iso"
          cp "$source_iso" "release-assets/$ISO_NAME"
          sha256sum "release-assets/$ISO_NAME" > "release-assets/$ISO_NAME.sha256"
          ls -lh release-assets
          df -h

      - name: Split ISO only when GitHub requires it
        run: |
          set -euxo pipefail
          size=$(stat -c '%s' "release-assets/$ISO_NAME")
          if [ "$size" -ge 2000000000 ]; then
            split -b 1900M -d -a 2 "release-assets/$ISO_NAME" "release-assets/$ISO_NAME.part-"
            rm "release-assets/$ISO_NAME"
            cat > release-assets/join-nomaeos-iso.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cat NomaeOS-Nomae-Box-amd64.iso.part-* > NomaeOS-Nomae-Box-amd64.iso
          sha256sum -c NomaeOS-Nomae-Box-amd64.iso.sha256
          echo "NomaeOS ISO rebuilt and verified."
          SCRIPT
            chmod +x release-assets/join-nomaeos-iso.sh
          fi
          ls -lh release-assets

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          # NomaeOS 0.1.0 Preview

          First bootable installer preview for the Nomae Box.

          Target prototype:
          - Jonsbo C6 case
          - AMD Ryzen 5 5500
          - Radeon RX 7600 8GB
          - ASUS PRIME A520M-K
          - GameSir Nova Lite 2.4GHz controller

          NomaeOS is based on Bazzite Deck and boots into a console-style Steam interface. The controller wake setup targets resume from suspend and does not promise cold power-on.

          This is a preview. Test installation, Steam Gaming Mode, networking, sound, graphics, suspend and controller wake on the exact machine before selling or giving it to a customer.

          When the ISO is split into parts, download every `.part-*` file, the checksum and `join-nomaeos-iso.sh` into one folder, then run the script.
          EOF

      - name: Publish or replace GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NomaeOS 0.1.0 Preview ISO" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "NomaeOS 0.1.0 Preview ISO" \
              --notes-file release-notes.md \
              --prerelease
          fi

      - name: Summary
        run: |
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
